<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blistiq Tools - 4-in-1 PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-xl mx-auto flex gap-4 font-medium">
            <a href="index.html" class="hover:text-blue-200">PDF Merger</a>
            <a href="4up.html" class="underline">4-in-1 PDF</a>
        </div>
    </nav>

    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-8 mt-10">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">4-in-1 PDF Maker</h1>
        <p class="text-gray-600 mb-6 text-sm">Upload a PDF to fit 4 pages onto a single A4 sheet for easy printing.</p>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Select a PDF File</label>
            <input 
                type="file" 
                id="file-input" 
                accept="application/pdf"
                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-md p-2"
            >
            <p id="file-name" class="mt-3 text-sm text-gray-600 font-medium"></p>
        </div>

        <button 
            id="convert-btn" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200"
        >
            Create 4-in-1 PDF
        </button>

        <div id="status" class="mt-4 text-center text-sm font-medium h-5"></div>
    </div>

    <script src="4up.js"></script>
</body>
</html>
