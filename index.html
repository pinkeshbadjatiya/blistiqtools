<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blistiq Tools - PDF Merger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<!-- Removed 'p-6' from body so the nav bar stretches edge-to-edge -->
<body class="bg-gray-50 min-h-screen font-sans">
    
    <!-- Navbar moved to the top, inside the body -->
    <nav class="bg-blue-600 text-white p-4 shadow-md w-full">
        <!-- Added 'justify-center' and 'gap-8' for better spacing -->
        <div class="max-w-xl mx-auto flex justify-center gap-8 font-medium">
            <a href="index.html" class="underline decoration-2 underline-offset-4">PDF Merger</a>
            <a href="4up.html" class="hover:text-blue-200 transition-colors">4-in-1 PDF</a>
        </div>
    </nav>

    <!-- Wrapped the tool inside a <main> tag with padding to keep the spacing right -->
    <main class="p-6">
        <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-8 mt-4">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">PDF Merger Tool</h1>
            <p class="text-gray-600 mb-6 text-sm">Select multiple PDFs to combine them into a single file. Processing happens directly on your device.</p>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Select PDF Files</label>
                <input 
                    type="file" 
                    id="file-input" 
                    multiple 
                    accept="application/pdf"
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-md p-2"
                >
                <ul id="file-list" class="mt-3 text-sm text-gray-600 list-disc pl-5"></ul>
            </div>

            <button 
                id="merge-btn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200"
            >
                Merge PDFs
            </button>

            <div id="status" class="mt-4 text-center text-sm font-medium h-5"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
