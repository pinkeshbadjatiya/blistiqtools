<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blistiq Tools - PDF Merger & Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    
    <nav class="bg-blue-600 text-white p-4 shadow-md w-full">
        <div class="max-w-xl mx-auto flex justify-center gap-8 font-medium">
            <a href="index.html" class="underline decoration-2 underline-offset-4">PDF Merger</a>
            <a href="4up.html" class="hover:text-blue-200 transition-colors">4-in-1 PDF</a>
        </div>
    </nav>

    <main class="p-6">
        <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-8 mt-4">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Merge & Extract Details</h1>
            <p class="text-gray-600 mb-6 text-sm">Combine PDFs, optionally resize them, and extract Customer Details to CSV using AI.</p>
            
            <div class="mb-6 flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Files</label>
                    <input 
                        type="file" 
                        id="file-input" 
                        multiple 
                        accept="application/pdf"
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-md p-2"
                    >
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-2">OR Select Folder</label>
                    <input 
                        type="file" 
                        id="folder-input" 
                        webkitdirectory 
                        directory
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 border border-gray-300 rounded-md p-2"
                    >
                </div>
            </div>

            <div class="mb-6">
                <p id="file-count" class="text-sm font-medium text-gray-800 mb-2"></p>
                <ul id="file-list" class="text-sm text-gray-600 list-disc pl-5 max-h-32 overflow-y-auto"></ul>
            </div>

            <!-- AI Extraction Settings -->
            <div class="mb-4 p-4 bg-purple-50 border border-purple-200 rounded-lg">
                <div class="flex items-center">
                    <input type="checkbox" id="extract-data" class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 rounded focus:ring-purple-500">
                    <label for="extract-data" class="ml-2 text-sm font-bold text-purple-900">Extract Details to CSV (Uses AI)</label>
                </div>
            </div>

            <!-- NEW: PDF Formatting Settings -->
            <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                <h3 class="text-sm font-bold text-blue-900 mb-3">PDF Formatting (Optional)</h3>
                <div class="flex items-center mb-2">
                    <input type="checkbox" id="fit-a4" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                    <label for="fit-a4" class="ml-2 text-sm font-medium text-gray-700">Fit perfectly in A4 size (no margin)</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="add-border" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                    <label for="add-border" class="ml-2 text-sm font-medium text-gray-700">Add a border on the page (for easy cutting)</label>
                </div>
            </div>

            <button 
                id="merge-btn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200"
            >
                Process PDFs
            </button>

            <div id="status" class="mt-4 text-center text-sm font-medium h-5"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
